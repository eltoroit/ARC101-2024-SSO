<template>
	<div class="slds-align_absolute-center">
		<div class="slds-form" style="width: 75%">
			<table>
				<template for:each={list} for:item="input">
					<tr key={input.key}>
						<th>{input.label}</th>
						<td data-key={input.key} onclick={onClick}>{input.value}</td>
					</tr>
				</template>
			</table>
			<slot name="additionalInput"></slot>
			<br />
			<div class="slds-align_absolute-center">
				<div>
					<slot></slot>
				</div>
			</div>
		</div>
	</div>
</template>
